<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Login — DigiID National Verification Platform</title>
    <meta name="description" content="Secure Super Admin Authentication for DigiID Identity Verification Platform">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin/styles.css">
</head>
<body>
    <div class="tricolor-stripe"></div>

    <div class="login-container">
        <div class="login-header">
            <div style="width:44px; height:44px; margin:0 auto; background:#102a43; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:20px;">
                🏛️
            </div>
            <h2>DigiID Super Admin</h2>
            <p>High-Assurance National ID Portal Administration</p>
        </div>

        <div id="alertBox" style="display:none; padding:12px 14px; border-radius:6px; font-size:12px; margin-bottom:18px; line-height:1.4;"></div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label for="adminEmail">Official Admin Email</label>
                <input type="email" id="adminEmail" class="form-control" placeholder="admin@digiid.gov.in" required autofocus autocomplete="username">
            </div>

            <div class="form-group">
                <label for="adminPassword">Master Password</label>
                <input type="password" id="adminPassword" class="form-control" placeholder="••••••••••••" required autocomplete="current-password">
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; font-size:12px; color:var(--text-muted);">
                <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                    <input type="checkbox" id="showPassword"> Show password
                </label>
                <span>Hardware Key / MFA Ready</span>
            </div>

            <button type="submit" id="loginBtn" class="btn btn-primary" style="width:100%; justify-content:center; padding:12px;">
                Authenticate & Access Dashboard
            </button>
        </form>

        <div style="margin-top:24px; text-align:center; font-size:11px; color:var(--text-muted); border-top:1px solid var(--border-color); padding-top:16px;">
            🔒 Protected by PBKDF2 Hashing, HMAC Signatures & Brute-Force Rate Limiting.<br>
            All admin access and actions are immutably logged in the audit ledger.
        </div>
    </div>

    <script>
        // Check if already authenticated
        const existingToken = localStorage.getItem('digiid_admin_token');
        if (existingToken) {
            fetch('/api/admin/auth/me', {
                headers: { 'Authorization': `Bearer ${existingToken}` }
            }).then(r => r.json()).then(data => {
                if (data.success) {
                    window.location.href = '/admin/dashboard';
                }
            }).catch(() => {});
        }

        const form = document.getElementById('adminLoginForm');
        const alertBox = document.getElementById('alertBox');
        const loginBtn = document.getElementById('loginBtn');
        const showPassword = document.getElementById('showPassword');
        const passwordInput = document.getElementById('adminPassword');

        showPassword.addEventListener('change', () => {
            passwordInput.type = showPassword.checked ? 'text' : 'password';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.style.display = 'none';

            const email = document.getElementById('adminEmail').value.trim();
            const password = passwordInput.value;

            if (!email || !password) return;

            loginBtn.disabled = true;
            loginBtn.textContent = 'Verifying Credentials…';

            try {
                const res = await fetch('/api/admin/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok || !data.success) {
                    alertBox.style.display = 'block';
                    alertBox.style.background = 'var(--danger-bg)';
                    alertBox.style.color = 'var(--danger)';
                    alertBox.style.border = '1px solid #fca5a5';
                    alertBox.textContent = data.error || 'Authentication failed. Please check your credentials.';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Authenticate & Access Dashboard';
                    return;
                }

                localStorage.setItem('digiid_admin_token', data.token);
                localStorage.setItem('digiid_admin_email', data.admin.email);

                alertBox.style.display = 'block';
                alertBox.style.background = 'var(--success-bg)';
                alertBox.style.color = 'var(--success)';
                alertBox.style.border = '1px solid #86efac';
                alertBox.textContent = 'Authentication successful! Redirecting to dashboard…';

                setTimeout(() => {
                    window.location.href = '/admin/dashboard';
                }, 800);

            } catch (err) {
                alertBox.style.display = 'block';
                alertBox.style.background = 'var(--danger-bg)';
                alertBox.style.color = 'var(--danger)';
                alertBox.textContent = 'Network or server error. Please try again.';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Authenticate & Access Dashboard';
            }
        });
    </script>
</body>
</html>
